apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossword-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crossword-backend
  template:
    metadata:
      labels:
        app: crossword-backend
    spec:
      containers:
        - name: backend
          image: dailybruin/crossword:backend
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
          env:
            # Google Sheet (published as CSV) that lists puzzles. Setting this is
            # the WordPress -> Sheets cutover switch: with it set the backend
            # reads from the Sheet; unset, it falls back to the old WP source.
            # Not a secret. To point at a different sheet later, edit this value
            # and re-run deploy.sh.
            - name: CROSSWORD_SHEET_URL
              value: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxkyB28Hg4bzKh915evgX3r1hKf49qkSz9Zbf0sctXxeUlvIbmT8xGqBRMKbbk9Gthl7hkpKBOv5xt/pub?output=csv"
---
apiVersion: v1
kind: Service
metadata:
  name: crossword-backend-svc
spec:
  selector:
    app: crossword-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
